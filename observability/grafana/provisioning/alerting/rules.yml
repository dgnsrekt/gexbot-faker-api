apiVersion: 1

groups:
  - orgId: 1
    name: Faker health
    folder: Faker
    interval: 1m
    rules:
      - uid: faker-target-down
        title: Faker target down
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model: {expr: 'min(up{job=~"faker-api|faker-daemon"})', instant: true, refId: A}
          - refId: C
            datasourceUid: __expr__
            model:
              conditions: [{evaluator: {params: [1], type: lt}, operator: {type: and}, query: {params: [A]}, reducer: {params: [], type: last}, type: query}]
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: C
              type: classic_conditions
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations: {summary: Faker API or daemon is unavailable}
        labels: {severity: critical}
      - uid: faker-http-errors
        title: Faker HTTP error rate high
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model: {expr: '(sum(rate(faker_http_requests_total{status_class="5xx"}[5m])) / clamp_min(sum(rate(faker_http_requests_total[5m])), 0.001)) and on() (sum(increase(faker_http_requests_total[5m])) >= 20)', instant: true, refId: A}
          - refId: C
            datasourceUid: __expr__
            model:
              conditions: [{evaluator: {params: [0.02], type: gt}, operator: {type: and}, query: {params: [A]}, reducer: {params: [], type: last}, type: query}]
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations: {summary: Faker API 5xx ratio exceeds 2%}
        labels: {severity: warning}
      - uid: faker-websocket-stalled
        title: Faker WebSocket stalled
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model: {expr: 'max((time() - faker_ws_last_broadcast_timestamp_seconds) and on(hub) (faker_ws_connections > 0))', instant: true, refId: A}
          - refId: C
            datasourceUid: __expr__
            model:
              conditions: [{evaluator: {params: [15], type: gt}, operator: {type: and}, query: {params: [A]}, reducer: {params: [], type: last}, type: query}]
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations: {summary: A WebSocket hub has clients but no broadcasts}
        labels: {severity: warning}
      - uid: faker-reload-failed
        title: Faker reload failed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model: {expr: 'sum(increase(faker_reloads_total{result="failed"}[15m]))', instant: true, refId: A}
          - refId: C
            datasourceUid: __expr__
            model:
              conditions: [{evaluator: {params: [0], type: gt}, operator: {type: and}, query: {params: [A]}, reducer: {params: [], type: last}, type: query}]
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations: {summary: Faker dataset reload failed}
        labels: {severity: warning}
      - uid: faker-websocket-send-errors
        title: Faker WebSocket send errors
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model: {expr: 'sum(increase(faker_ws_send_errors_total[5m]))', instant: true, refId: A}
          - refId: C
            datasourceUid: __expr__
            model:
              conditions: [{evaluator: {params: [0], type: gt}, operator: {type: and}, query: {params: [A]}, reducer: {params: [], type: last}, type: query}]
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations: {summary: Faker WebSocket clients are dropping messages}
        labels: {severity: warning}
      - uid: faker-daemon-failed
        title: Faker daemon download failed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model: {expr: 'sum(increase(faker_daemon_download_runs_total{result="failed"}[15m]))', instant: true, refId: A}
          - refId: C
            datasourceUid: __expr__
            model:
              conditions: [{evaluator: {params: [0], type: gt}, operator: {type: and}, query: {params: [A]}, reducer: {params: [], type: last}, type: query}]
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations: {summary: Faker daemon download failed}
        labels: {severity: critical}
      - uid: faker-data-stale
        title: Faker data stale
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model: {expr: 'time() - faker_data_date_timestamp_seconds', instant: true, refId: A}
          - refId: C
            datasourceUid: __expr__
            model:
              conditions: [{evaluator: {params: [432000], type: gt}, operator: {type: and}, query: {params: [A]}, reducer: {params: [], type: last}, type: query}]
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: C
              type: classic_conditions
        noDataState: Alerting
        execErrState: Error
        for: 1h
        annotations: {summary: Faker dataset is more than five days old}
        labels: {severity: warning}
