groups:
  - name: faker
    rules:
      - alert: FakerTargetDown
        expr: up{job=~"faker-api|faker-daemon"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }} is unavailable"
      - alert: FakerHTTPErrorRateHigh
        expr: sum(rate(faker_http_requests_total{status_class="5xx"}[5m])) / sum(rate(faker_http_requests_total[5m])) > 0.02 and sum(increase(faker_http_requests_total[5m])) >= 20
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Faker API 5xx ratio exceeds 2%
      - alert: FakerWebSocketStalled
        # `and on(hub)`: sum(...) by (hub) has only the hub label, while the
        # timestamp series carries job/instance too, so a bare `and` matches no
        # elements. The last-broadcast series is seeded when a hub gets its first
        # client (see Hub.Run), so a hub that never broadcasts is still detected.
        expr: max by (hub) ((time() - faker_ws_last_broadcast_timestamp_seconds) and on(hub) (faker_ws_connections > 0)) > 15
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "WebSocket hub {{ $labels.hub }} has stopped broadcasting"
      - alert: FakerWebSocketSendErrors
        expr: increase(faker_ws_send_errors_total[5m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "WebSocket hub {{ $labels.hub }} is dropping clients"
      - alert: FakerReloadFailed
        expr: increase(faker_reloads_total{result="failed"}[15m]) > 0
        labels: {severity: warning}
        annotations:
          summary: Faker dataset reload failed
      - alert: FakerDaemonDownloadFailed
        expr: increase(faker_daemon_download_runs_total{result="failed"}[15m]) > 0
        labels: {severity: critical}
        annotations:
          summary: Faker daemon download failed
      - alert: FakerDataStale
        expr: time() - faker_data_date_timestamp_seconds > 432000
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: Faker dataset is more than five days old
      - alert: FakerDataVolumeLow
        # Disk exhaustion on the growing data volume is the characteristic failure mode.
        # Warn in [3 GiB, 10 GiB) — the lower bound keeps this from firing alongside the
        # critical alert (no Alertmanager inhibition in this stack yet).
        expr: faker_data_volume_free_bytes < 10 * 1024 * 1024 * 1024 and faker_data_volume_free_bytes >= 3 * 1024 * 1024 * 1024
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Data volume low on free space ({{ $value | humanize1024 }}B free)"
      - alert: FakerDataVolumeCritical
        expr: faker_data_volume_free_bytes < 3 * 1024 * 1024 * 1024
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Data volume critically low ({{ $value | humanize1024 }}B free)"
      - alert: FakerDataVolumeStatfsFailing
        # The byte/inode series are omitted on a statfs error, so watch the always-present
        # success flag — otherwise disk monitoring goes dark while the target stays green.
        expr: faker_data_volume_statfs_success == 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: Data-volume statfs is failing (disk metrics unavailable)
      - alert: FakerDaemonDownloadOverdue
        # Market-aware freshness: the daemon owns the NYSE calendar and sets this to 1
        # only when the last successful download is behind the latest market date whose
        # scheduled time has passed — so it does not false-alarm over weekends/holidays.
        # `for: 2h` clears the normal post-schedule download+retry window.
        expr: faker_daemon_download_overdue == 1
        for: 2h
        labels: {severity: warning}
        annotations:
          summary: Daemon is behind on EOD downloads (missed a required session)
