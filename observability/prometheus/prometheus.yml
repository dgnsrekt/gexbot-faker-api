global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml

# Deliver firing alerts to Alertmanager, which forwards them to ntfy (via the daemon's
# /alerts/ntfy webhook bridge) — so alerts page an operator, not just render in Studio.
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: faker-api
    static_configs:
      - targets: [gex-faker-api:9090]
  - job_name: faker-daemon
    static_configs:
      - targets: [gex-daemon:9091]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
