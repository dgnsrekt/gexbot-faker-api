openapi: 3.0.3
info:
  title: GEX Faker API
  version: 2.0.0
  description: |
    Historical GEX data server with per-API-key sequential playback.
    Serves JSONL data files with configurable cache modes.

servers:
  - url: /
    description: Current server

tags:
  - name: classic
    description: Classic GEX data endpoints
  - name: state
    description: State GEX data endpoints (orderflow-based)
  - name: orderflow
    description: Orderflow data endpoints
  - name: download
    description: Bulk data download endpoints
  - name: info
    description: Server information endpoints
  - name: websocket
    description: WebSocket real-time feed endpoints
  - name: admin
    description: Administrative endpoints

paths:
  /{ticker}/classic/{aggregation}/majors:
    get:
      operationId: getClassicGexMajors
      summary: Get GEX major levels
      description: |
        Provides the key GEX levels (Zero Gamma, Major Positive/Negative GEX by OI
        and Volume) from the classic GEX model. This is a slimmed-down version of
        the main GEX chain endpoint.
      tags: [classic]
      parameters:
        - name: ticker
          in: path
          required: true
          description: Ticker symbol (e.g., SPX)
          schema:
            type: string
            pattern: '^[A-Z]{1,5}$'
          example: SPX
        - name: aggregation
          in: path
          required: true
          description: "Aggregation period: full, zero, or one"
          schema:
            type: string
            enum: [gex_full, gex_zero, gex_one]
          example: gex_zero
      responses:
        '200':
          description: GEX major levels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GexMajorsData'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data not found or exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /{ticker}/classic/{aggregation}/maxchange:
    get:
      operationId: getClassicGexMaxChange
      summary: Get GEX max change levels
      description: |
        Contains the strikes with the most significant GEX change over various
        lookback periods (current, 1, 5, 10, 15, and 30 minutes). Also known as "max priors".
      tags: [classic]
      parameters:
        - name: ticker
          in: path
          required: true
          description: Ticker symbol (e.g., SPX)
          schema:
            type: string
            pattern: '^[A-Z]{1,5}$'
          example: SPX
        - name: aggregation
          in: path
          required: true
          description: "Aggregation period: full, zero, or one"
          schema:
            type: string
            enum: [gex_full, gex_zero, gex_one]
          example: gex_zero
      responses:
        '200':
          description: GEX max change data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GexMaxChangeData'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data not found or exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /{ticker}/classic/{aggregation}:
    get:
      operationId: getClassicGexChain
      summary: Get GEX chain data
      description: |
        Provides a ladder-style histogram of GEX by Open Interest and Volume.
        Call GEX is netted against Put GEX for each strike.
        Includes historical "lookback" data points and major calculated levels.
      tags: [classic]
      parameters:
        - name: ticker
          in: path
          required: true
          description: Ticker symbol (e.g., SPX)
          schema:
            type: string
            pattern: '^[A-Z]{1,5}$'
          example: SPX
        - name: aggregation
          in: path
          required: true
          description: "Aggregation period: full, zero, or one"
          schema:
            type: string
            enum: [gex_full, gex_zero, gex_one]
          example: gex_zero
      responses:
        '200':
          description: GEX chain data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GexData'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data not found or exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /{ticker}/state/{type}/majors:
    get:
      operationId: getStateGexMajors
      summary: Get GEX profile major levels
      description: |
        Provides the major levels from the GEX Profile, including the strikes
        with the largest positive (call) and negative (put) GEX imbalances.
        This is a slimmed-down version of the main GEX profile endpoint.
        Only supports aggregation types (full, zero, one), not greek types.
      tags: [state]
      parameters:
        - name: ticker
          in: path
          required: true
          description: Ticker symbol (e.g., SPX)
          schema:
            type: string
            pattern: '^[A-Z]{1,5}$'
          example: SPX
        - name: type
          in: path
          required: true
          description: "Aggregation period: full, zero, or one"
          schema:
            type: string
            enum: [gex_full, gex_zero, gex_one]
          example: gex_zero
      responses:
        '200':
          description: GEX profile major levels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GexMajorsData'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data not found or exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /{ticker}/state/{type}/maxchange:
    get:
      operationId: getStateGexMaxChange
      summary: Get GEX profile max change levels
      description: |
        Shows the strikes with the most significant change in GEX imbalance
        over various lookback periods (current, 1, 5, 10, 15, and 30 minutes).
        Also known as "max priors" for the GEX Profile.
        Only supports aggregation types (full, zero, one), not greek types.
      tags: [state]
      parameters:
        - name: ticker
          in: path
          required: true
          description: Ticker symbol (e.g., SPX)
          schema:
            type: string
            pattern: '^[A-Z]{1,5}$'
          example: SPX
        - name: type
          in: path
          required: true
          description: "Aggregation period: full, zero, or one"
          schema:
            type: string
            enum: [gex_full, gex_zero, gex_one]
          example: gex_zero
      responses:
        '200':
          description: GEX profile max change data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GexMaxChangeData'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data not found or exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /{ticker}/state/{type}:
    get:
      operationId: getStateProfile
      summary: Get state profile data (GEX or Greeks)
      description: |
        Unified endpoint for state profile data.

        When type is an aggregation (full, zero, one):
          Returns GEX profile data - nets out imbalanced calls against imbalanced puts
          to locate areas of significant imbalanced exposure.

        When type is a greek (delta_zero, gamma_zero, etc.):
          Returns Greek profile data - shows net imbalance of transactions for the
          specified Greek, allowing analysis of customer long vs. short positioning.
      tags: [state]
      parameters:
        - name: ticker
          in: path
          required: true
          description: Ticker symbol (e.g., SPX)
          schema:
            type: string
            pattern: '^[A-Z]{1,5}$'
          example: SPX
        - name: type
          in: path
          required: true
          description: "Aggregation period (full, zero, one) OR Greek type (delta_zero, gamma_zero, etc.)"
          schema:
            type: string
            enum: [gex_full, gex_zero, gex_one, delta_zero, gamma_zero, delta_one, gamma_one, charm_zero, vanna_zero, charm_one, vanna_one]
          example: gex_zero
      responses:
        '200':
          description: Profile data (GexData for aggregations, GreekProfileData for greeks)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GexData'
                  - $ref: '#/components/schemas/GreekProfileData'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data not found or exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /{ticker}/orderflow/orderflow:
    get:
      operationId: getOrderflowLatest
      summary: Get latest orderflow metrics
      description: |
        Provides a real-time snapshot of key orderflow metrics for the nearest
        and next expiries. Includes aggregated and net dealer exposure (DEX),
        GEX, convexity, vanna, and charm, as well as orderflow indicators.
      tags: [orderflow]
      parameters:
        - name: ticker
          in: path
          required: true
          description: Ticker symbol (e.g., SPX)
          schema:
            type: string
            pattern: '^[A-Z_]{1,10}$'
          example: SPX
      responses:
        '200':
          description: Orderflow metrics data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderflowData'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data not found or exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tickers:
    get:
      operationId: getTickers
      summary: List available tickers
      tags: [info]
      responses:
        '200':
          description: Available tickers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickersResponse'

  /tickers/quant:
    get:
      operationId: getTickersQuant
      summary: List quant-supported tickers
      description: Stocks and indexes available for quant endpoints (no futures).
      tags: [info]
      responses:
        '200':
          description: Quant-supported tickers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuantTickersResponse'

  /{package}/categories:
    get:
      operationId: getPackageCategories
      summary: List categories for a package
      description: "Returns the category names supported by a data package."
      tags: [info]
      parameters:
        - name: package
          in: path
          required: true
          description: "Data package: state, classic, or orderflow"
          schema:
            type: string
            enum: [state, classic, orderflow]
          example: classic
      responses:
        '200':
          description: Category names for the package
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          description: Invalid package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /hist/eod/{ticker}:
    get:
      operationId: getHistEod
      summary: Download the latest end-of-day archive
      description: Returns the most recent EOD report archive (zip) for a ticker.
      tags: [hist]
      parameters:
        - name: ticker
          in: path
          required: true
          description: Ticker symbol (e.g., SPX)
          schema:
            type: string
            pattern: '^[A-Z]{1,5}$'
          example: SPX
      responses:
        '200':
          description: EOD report archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '404':
          description: No archive available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /hist/{ticker}/{package}/{category}/{date}:
    get:
      operationId: getHistSnapshot
      summary: Historical snapshot download link
      description: |
        Returns a URL to the historical snapshot for a ticker/package/category on
        a given date. Mirrors the live API's URL-indirection response.
      tags: [hist]
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z]{1,5}$'
          example: SPX
        - name: package
          in: path
          required: true
          schema:
            type: string
            enum: [state, classic, orderflow]
          example: classic
        - name: category
          in: path
          required: true
          description: "Category within the package (e.g. gex_zero, gamma_zero, orderflow)"
          schema:
            type: string
          example: gex_zero
        - name: date
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          example: 2026-08-07
        - name: noredirect
          in: query
          required: false
          allowEmptyValue: true
          description: |
            Presence-only flag (live/client form is a bare `?noredirect`). When
            present, the JSON `{url}` body is returned; when absent, a 302 redirect
            to that URL is returned.
          schema:
            type: string
      responses:
        '200':
          description: Snapshot download URL (returned when ?noredirect is present)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistSnapshotResponse'
        '302':
          description: Redirect to the snapshot URL (returned when noredirect is absent)
          headers:
            Location:
              description: URL of the historical snapshot
              schema:
                type: string
        '404':
          description: Snapshot not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /options/{ticker}/expiries:
    get:
      operationId: getOptionsExpiries
      summary: List valid option expiries
      description: |
        Returns valid option expiration dates for a ticker over the published
        horizon: the loaded data date through +90 calendar days. Near-term
        expiries are grounded in the loaded data's min_dte/sec_min_dte; the rest
        follow the options calendar (daily near-term for index/major-ETF tickers,
        then weekly). Remove dashes to form explicit-expiry WebSocket group
        suffixes (2026-07-17 -> 20260717).
      tags: [options]
      parameters:
        - name: ticker
          in: path
          required: true
          description: Canonical option-owning ticker (e.g., SPX, SPY, QQQ)
          schema:
            type: string
            pattern: '^[A-Z]{1,5}$'
          example: SPX
      responses:
        '200':
          description: Valid option expiries within the horizon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpiriesResponse'
        '400':
          description: Unsupported or invalid option ticker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No expiries available (current date is not a calendar date)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /futures/conversion:
    get:
      operationId: getFuturesConversion
      summary: Get spot-to-futures conversion parameters
      description: |
        Returns the active front-month futures contract and affine conversion
        parameters (spot ~= multiplier * future + additive) for an index/future
        pair. The faker derives the contract code from the loaded date and uses a
        fixed per-pair basis; multiplier/additive are synthesized (no futures feed).
      tags: [futures]
      parameters:
        - name: ticker
          in: query
          required: true
          description: Index/ETF ticker
          schema:
            type: string
            enum: [SPX, SPY, NDX, QQQ, RUT, IWM, DIA, GLD, USO]
          example: SPX
        - name: future
          in: query
          required: true
          description: Futures root
          schema:
            type: string
            enum: [ES, NQ, RTY, YM, GC, CL]
          example: ES
        - name: model
          in: query
          required: false
          description: Conversion model
          schema:
            type: string
            enum: [additive, multiplicative, affine]
            default: additive
          example: additive
      responses:
        '200':
          description: Futures conversion parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuturesConversionResponse'
        '400':
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [info]
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /reset-cache:
    post:
      operationId: resetCache
      summary: Reset playback positions
      description: Reset all or specific API key playback positions to index 0
      tags: [admin]
      parameters:
        - name: key
          in: query
          required: false
          description: Reset only this API key (omit for all)
          schema:
            type: string
      responses:
        '200':
          description: Cache reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetCacheResponse'

  /seek-to-timestamp:
    post:
      operationId: seekToTimestamp
      summary: Seek playback positions to timestamp
      description: |
        Sets all cache positions for the given API key to the index
        where data timestamp >= the given timestamp. This allows
        seeking to a specific point in the historical data playback.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeekToTimestampRequest'
      responses:
        '200':
          description: Seek successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeekToTimestampResponse'
        '400':
          description: Invalid request or timestamp out of range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /load-range:
    post:
      operationId: loadRange
      summary: Load a contiguous span of trading days for continuous replay
      description: |
        Materializes (if needed) and loads a range of days as one continuous dataset so seek/replay
        can cross day boundaries. Asynchronous: returns a job id immediately; poll
        GET /load-range/status/{jobId} until state=done. Provide either from+to (the available
        archived days within the span are loaded) or an explicit dates list.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadRangeRequest'
      responses:
        '202':
          description: Load-range job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadRangeStatus'
        '400':
          description: Invalid request or no archived dates in range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /load-range/status/{jobId}:
    get:
      operationId: getLoadRangeStatus
      summary: Poll a load-range job
      tags: [admin]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadRangeStatus'
        '404':
          description: Unknown job id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /range-coverage:
    get:
      operationId: getRangeCoverage
      summary: Ticker coverage across a date span (pre-load)
      description: |
        Reports, from the archive inventory (no load required), which tickers each day in [from, to]
        covers, plus the union and intersection across the span — so a client can warn before loading
        that a ticker isn't present on every day.
      tags: [admin]
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Coverage across the span
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RangeCoverageResponse'
        '400':
          description: Invalid date range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /current-range:
    get:
      operationId: getCurrentRange
      summary: The currently loaded span
      tags: [admin]
      responses:
        '200':
          description: Currently loaded range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentRangeResponse'

  /reload-date:
    post:
      operationId: reloadDate
      summary: Hot reload data for a different date
      description: |
        Unloads current data and loads data for the specified date.
        WebSocket streaming is paused during reload.
        All cache positions are reset to 0 after reload.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReloadDateRequest'
      responses:
        '200':
          description: Reload successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReloadDateResponse'
        '400':
          description: Invalid date format or date not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Reload already in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Reload failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /available-dates:
    get:
      operationId: getAvailableDates
      summary: List available dates
      description: Returns sorted list of available date directories in data/ folder (YYYY-MM-DD format, excludes .staging)
      tags: [info]
      responses:
        '200':
          description: Available dates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableDatesResponse'

  /current-date:
    get:
      operationId: getCurrentDate
      summary: Get current date
      description: Returns the currently loaded date, load timestamp, and number of files loaded
      tags: [info]
      responses:
        '200':
          description: Current date info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentDateResponse'

  /available-data/{date}:
    get:
      operationId: getAvailableData
      summary: Get available data for a date
      description: |
        Returns hierarchical listing of available data for a specific date.
        Shows tickers, packages, and categories that exist in the data directory.
      tags: [info]
      parameters:
        - name: date
          in: path
          required: true
          description: Date in YYYY-MM-DD format
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "2025-12-04"
        - name: ticker
          in: query
          required: false
          description: Filter to a specific ticker
          schema:
            type: string
            pattern: '^[A-Z]{1,5}$'
          example: SPX
      responses:
        '200':
          description: Available data for the date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableDataResponse'

  /download/{date}/{ticker}/links:
    get:
      operationId: getDownloadLinks
      summary: Get available download links for a date/ticker
      description: Returns all available download links grouped by package (classic, state, orderflow)
      tags: [download]
      parameters:
        - name: date
          in: path
          required: true
          description: Data date in YYYY-MM-DD format
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "2025-12-04"
        - name: ticker
          in: path
          required: true
          description: Ticker symbol (uppercase)
          schema:
            type: string
            pattern: '^[A-Z]{1,5}$'
          example: SPX
      responses:
        '200':
          description: Available download links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadLinksResponse'
        '404':
          description: No data found for date/ticker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /download/{date}/{ticker}/classic/{aggregation}:
    get:
      operationId: downloadClassicGex
      summary: Download classic GEX dataset
      description: Downloads the complete JSONL data file for classic GEX data for a specific date
      tags: [download]
      parameters:
        - name: date
          in: path
          required: true
          description: Data date in YYYY-MM-DD format
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "2025-12-04"
        - name: ticker
          in: path
          required: true
          description: Ticker symbol (uppercase)
          schema:
            type: string
            pattern: '^[A-Z]{1,5}$'
          example: SPX
        - name: aggregation
          in: path
          required: true
          description: DTE aggregation period
          schema:
            type: string
            enum: [gex_full, gex_zero, gex_one]
          example: gex_zero
      responses:
        '200':
          description: JSONL file download
          content:
            application/x-ndjson:
              schema:
                type: string
                format: binary
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /download/{date}/{ticker}/state/{type}:
    get:
      operationId: downloadStateData
      summary: Download state dataset
      description: Downloads the complete JSONL data file for state GEX or greek data for a specific date
      tags: [download]
      parameters:
        - name: date
          in: path
          required: true
          description: Data date in YYYY-MM-DD format
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "2025-12-04"
        - name: ticker
          in: path
          required: true
          description: Ticker symbol (uppercase)
          schema:
            type: string
            pattern: '^[A-Z]{1,5}$'
          example: SPX
        - name: type
          in: path
          required: true
          description: Type parameter (aggregation or greek type)
          schema:
            type: string
            enum: [gex_full, gex_zero, gex_one, delta_zero, gamma_zero, delta_one, gamma_one, charm_zero, vanna_zero, charm_one, vanna_one]
          example: gex_zero
      responses:
        '200':
          description: JSONL file download
          content:
            application/x-ndjson:
              schema:
                type: string
                format: binary
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /download/{date}/{ticker}/orderflow:
    get:
      operationId: downloadOrderflow
      summary: Download orderflow dataset
      description: Downloads the complete JSONL data file for orderflow data for a specific date
      tags: [download]
      parameters:
        - name: date
          in: path
          required: true
          description: Data date in YYYY-MM-DD format
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "2025-12-04"
        - name: ticker
          in: path
          required: true
          description: Ticker symbol (uppercase)
          schema:
            type: string
            pattern: '^[A-Z_]{1,10}$'
          example: SPX
      responses:
        '200':
          description: JSONL file download
          content:
            application/x-ndjson:
              schema:
                type: string
                format: binary
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    GexData:
      type: object
      required:
        - timestamp
        - ticker
      properties:
        timestamp:
          type: integer
          format: int64
          example: 1764340202
        ticker:
          type: string
          example: SPX
        min_dte:
          type: integer
          example: 0
        sec_min_dte:
          type: integer
          example: 3
        spot:
          type: number
          format: double
          example: 6822.95
        zero_gamma:
          type: number
          format: double
          example: 0
        major_pos_vol:
          type: number
          format: double
          example: 0
        major_pos_oi:
          type: number
          format: double
          example: 0
        major_neg_vol:
          type: number
          format: double
          example: 0
        major_neg_oi:
          type: number
          format: double
          example: 0
        strikes:
          type: array
          items: {}
        sum_gex_vol:
          type: number
          format: double
          example: 0
        sum_gex_oi:
          type: number
          format: double
          example: 43565.23
        delta_risk_reversal:
          type: number
          format: double
          example: 0
        max_priors:
          type: array
          items: {}

    TickersResponse:
      type: object
      properties:
        stocks:
          type: array
          items:
            type: string
          description: Array of stock ticker symbols
          example: ["AAPL", "NVDA", "TSLA"]
        indexes:
          type: array
          items:
            type: string
          description: Array of index ticker symbols
          example: ["SPX", "NDX", "VIX", "RUT"]
        futures:
          type: array
          items:
            type: string
          description: Array of futures ticker symbols
          example: ["ES_SPX", "NQ_NDX"]

    FuturesConversionResponse:
      type: object
      required: [future_contract, multiplier, additive]
      properties:
        future_contract:
          type: string
          description: Active front-month futures contract code (e.g. ESU6)
          example: ESU6
        multiplier:
          type: number
          format: double
          description: Multiplicative term of the affine conversion
          example: 1
        additive:
          type: number
          format: double
          description: Additive term of the affine conversion
          example: 23.6657268366

    ExpiriesResponse:
      type: object
      required: [ticker, start_date, end_date, expiries]
      properties:
        ticker:
          type: string
          description: Canonical ticker used for the expiry lookup
          example: SPX
        start_date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Start of the published horizon (the loaded data date)
          example: 2026-08-07
        end_date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: End of the horizon (start date + 90 calendar days)
          example: 2026-11-05
        expiries:
          type: array
          items:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Valid option expiries in YYYY-MM-DD within the horizon

    HistSnapshotResponse:
      type: object
      properties:
        url:
          type: string
          description: URL to the historical snapshot data
          example: /download/2026-08-07/SPX/classic/gex_zero
      required: [url]

    QuantTickersResponse:
      type: object
      properties:
        stocks:
          type: array
          items:
            type: string
          description: Array of quant-supported stock ticker symbols
          example: ["AAPL", "NVDA", "TSLA"]
        indexes:
          type: array
          items:
            type: string
          description: Array of quant-supported index ticker symbols
          example: ["SPX", "NDX"]

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        data_date:
          type: string
          example: "2025-11-28"
        data_mode:
          type: string
          enum: [memory, stream]
          example: memory
        cache_mode:
          type: string
          enum: [exhaust, rotation]
          example: exhaust

    ResetCacheResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: All cache positions reset to index 0
        count:
          type: integer
          description: Number of positions reset
          example: 12

    SeekToTimestampRequest:
      type: object
      required:
        - timestamp
        - key
      properties:
        timestamp:
          type: integer
          format: int64
          description: Unix timestamp to seek to
          example: 1732900000
        key:
          type: string
          description: API key for playback position tracking
          minLength: 1
          example: test1234

    SeekToTimestampResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Seeked 15 positions to timestamp 1732900000
        positions_set:
          type: integer
          description: Number of cache positions that were set
          example: 15
        details:
          type: array
          description: Details of each position that was set
          items:
            $ref: '#/components/schemas/SeekPositionDetail'
        resolved_ts:
          type: integer
          format: int64
          description: Timestamp the cursor landed on for the representative stream (may differ from requested when clamped or across a gap)
          example: 1732900005
        day:
          type: string
          description: The loaded day the resolved row belongs to (range mode)
          example: '2026-08-07'
        in_gap:
          type: boolean
          description: The requested timestamp fell in an inter-session gap; the cursor was clamped forward to the next session open
          example: false
        clamped:
          type: string
          description: Whether the seek was clamped to the span bounds
          enum: [none, start, end]
          example: none
        reason:
          type: string
          description: Human-readable note when clamped or in a gap
          example: ''

    SeekPositionDetail:
      type: object
      properties:
        data_key:
          type: string
          description: The data key (ticker/pkg/category)
          example: SPX/classic/gex_zero
        index:
          type: integer
          description: The index position set
          example: 142
        timestamp:
          type: integer
          format: int64
          description: The actual timestamp at that index
          example: 1732900005

    LoadRangeRequest:
      type: object
      description: Provide from+to (inclusive span; the available archived days are loaded) or an explicit dates list.
      properties:
        from:
          type: string
          example: '2026-08-06'
        to:
          type: string
          example: '2026-08-10'
        dates:
          type: array
          items:
            type: string
          example: ['2026-08-06', '2026-08-07']

    LoadedRange:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
        dates:
          type: array
          items:
            type: string

    LoadRangeStatus:
      type: object
      properties:
        job_id:
          type: string
          example: range-1
        dates:
          type: array
          items:
            type: string
        state:
          type: string
          enum: [queued, running, done, error]
        done:
          type: integer
          description: Days materialized so far
        total:
          type: integer
          description: Days in the span
        loaded_range:
          $ref: '#/components/schemas/LoadedRange'
        error:
          type: string

    RangeCoverageDay:
      type: object
      properties:
        date:
          type: string
        tickers:
          type: array
          items:
            type: string

    RangeCoverageResponse:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
        days:
          type: array
          items:
            $ref: '#/components/schemas/RangeCoverageDay'
        union:
          type: array
          items:
            type: string
        intersection:
          type: array
          items:
            type: string

    CurrentRangeResponse:
      type: object
      properties:
        dates:
          type: array
          items:
            type: string
        from:
          type: string
        to:
          type: string
        files_loaded:
          type: integer
        loaded_at:
          type: string
          format: date-time

    GexMajorsData:
      type: object
      required:
        - timestamp
        - ticker
      properties:
        timestamp:
          type: integer
          format: int64
          example: 1764340202
        ticker:
          type: string
          minLength: 2
          maxLength: 5
          example: SPX
        spot:
          type: number
          format: double
          example: 6822.95
        mpos_vol:
          type: number
          format: double
          example: 6100
        mpos_oi:
          type: number
          format: double
          example: 6100
        mneg_vol:
          type: number
          format: double
          example: 5800
        mneg_oi:
          type: number
          format: double
          example: 5800
        zero_gamma:
          type: number
          format: double
          example: 5950
        net_gex_vol:
          type: number
          format: double
          example: 12500.5
        net_gex_oi:
          type: number
          format: double
          example: 43565.23

    GexMaxChangeData:
      type: object
      required:
        - timestamp
        - ticker
      properties:
        timestamp:
          type: integer
          format: int64
          example: 1764340202
        ticker:
          type: string
          minLength: 2
          maxLength: 5
          example: SPX
        current:
          type: array
          items:
            type: number
          description: Current max GEX change [strike, gex_value]
        one:
          type: array
          items:
            type: number
          description: 1-minute lookback max GEX change
        five:
          type: array
          items:
            type: number
          description: 5-minute lookback max GEX change
        ten:
          type: array
          items:
            type: number
          description: 10-minute lookback max GEX change
        fifteen:
          type: array
          items:
            type: number
          description: 15-minute lookback max GEX change
        thirty:
          type: array
          items:
            type: number
          description: 30-minute lookback max GEX change

    GreekProfileData:
      type: object
      required:
        - timestamp
        - ticker
      properties:
        timestamp:
          type: integer
          format: int64
          example: 1764340202
        ticker:
          type: string
          minLength: 2
          maxLength: 5
          example: SPX
        spot:
          type: number
          format: double
          example: 6822.95
        min_dte:
          type: integer
          example: 0
        sec_min_dte:
          type: integer
          example: 3
        major_positive:
          type: number
          format: double
          example: 6100
        major_negative:
          type: number
          format: double
          example: 5800
        major_long_gamma:
          type: number
          format: double
          example: 6585
        major_short_gamma:
          type: number
          format: double
          example: 6585
        mini_contracts:
          type: array
          items:
            type: array
          description: Array of contract data arrays

    OrderflowData:
      type: object
      required:
        - timestamp
        - ticker
      properties:
        timestamp:
          type: integer
          format: int64
        ticker:
          type: string
          minLength: 2
          maxLength: 5
        spot:
          type: number
          format: double
        z_mlgamma:
          type: number
        z_msgamma:
          type: number
        o_mlgamma:
          type: number
        o_msgamma:
          type: number
        zero_mcall:
          type: number
        zero_mput:
          type: number
        one_mcall:
          type: number
        one_mput:
          type: number
        zcvr:
          type: number
        ocvr:
          type: number
        zgr:
          type: number
        ogr:
          type: number
        zvanna:
          type: number
        ovanna:
          type: number
        zcharm:
          type: number
        ocharm:
          type: number
        agg_dex:
          type: number
        one_agg_dex:
          type: number
        agg_call_dex:
          type: number
        one_agg_call_dex:
          type: number
        agg_put_dex:
          type: number
        one_agg_put_dex:
          type: number
        net_dex:
          type: number
        one_net_dex:
          type: number
        net_call_dex:
          type: number
        one_net_call_dex:
          type: number
        net_put_dex:
          type: number
        one_net_put_dex:
          type: number
        dexoflow:
          type: number
        gexoflow:
          type: number
        cvroflow:
          type: number
        one_dexoflow:
          type: number
        one_gexoflow:
          type: number
        one_cvroflow:
          type: number
      additionalProperties: false

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Invalid ticker symbol

    AvailableDatesResponse:
      type: object
      properties:
        dates:
          type: array
          items:
            type: string
          description: Sorted list of available date directories
          example: ["2025-11-14", "2025-11-28"]
        count:
          type: integer
          description: Number of available dates
          example: 2

    CurrentDateResponse:
      type: object
      properties:
        current_date:
          type: string
          description: Currently loaded data date
          example: "2025-11-28"
        loaded_at:
          type: string
          format: date-time
          description: Timestamp when data was loaded
          example: "2025-11-29T18:15:00Z"
        files_loaded:
          type: integer
          description: Number of data files loaded
          example: 12

    AvailableDataResponse:
      type: object
      properties:
        date:
          type: string
          description: The requested date
          example: "2025-12-04"
        tickers:
          type: array
          items:
            $ref: '#/components/schemas/TickerData'
          description: Available tickers with their packages
        summary:
          $ref: '#/components/schemas/DataSummary'

    TickerData:
      type: object
      properties:
        symbol:
          type: string
          description: Ticker symbol
          example: SPX
        packages:
          type: array
          items:
            $ref: '#/components/schemas/PackageData'
          description: Available packages for this ticker

    PackageData:
      type: object
      properties:
        name:
          type: string
          description: Package name
          enum: [classic, state, orderflow]
          example: classic
        categories:
          type: array
          items:
            type: string
          description: Available categories in this package
          example: ["gex_full", "gex_one", "gex_zero"]

    DataSummary:
      type: object
      properties:
        total_tickers:
          type: integer
          description: Number of tickers with data
          example: 3
        total_files:
          type: integer
          description: Total number of data files
          example: 45

    DownloadLinksResponse:
      type: object
      required:
        - date
        - ticker
        - links
      properties:
        date:
          type: string
          description: Data date
          example: "2025-12-04"
        ticker:
          type: string
          description: Ticker symbol
          example: SPX
        links:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Flat list of download paths grouped by package
          example:
            classic:
              - "/download/2025-12-04/SPX/classic/full"
              - "/download/2025-12-04/SPX/classic/zero"
            state:
              - "/download/2025-12-04/SPX/state/delta_zero"
            orderflow:
              - "/download/2025-12-04/SPX/orderflow"
        summary:
          $ref: '#/components/schemas/DownloadLinksSummary'

    DownloadLinksSummary:
      type: object
      properties:
        total_links:
          type: integer
          description: Total number of download links
          example: 15

    ReloadDateRequest:
      type: object
      required:
        - date
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: New date to load (YYYY-MM-DD format)
          example: "2025-12-04"

    ReloadDateResponse:
      type: object
      properties:
        status:
          type: string
          description: Result status
          example: success
        previous_date:
          type: string
          description: Previously loaded date
          example: "2025-11-28"
        new_date:
          type: string
          description: Newly loaded date
          example: "2025-12-04"
        loaded_at:
          type: string
          format: date-time
          description: Timestamp when new data was loaded
          example: "2025-12-27T15:30:00Z"
        files_loaded:
          type: integer
          description: Number of data files loaded
          example: 45
