# Daily check that the embedded internal/config/tickers.json still matches
# GEXbot's live /tickers list. Fails (red X + notification) when GEXbot
# adds/removes tickers — then run `go run ./cmd/synctickers` locally and commit
# the refreshed file. The /tickers endpoint is unauthenticated, so no secrets.
name: tickers-check
on:
  schedule:
    - cron: "17 13 * * *" # daily ~13:17 UTC; one hit on the endpoint, not per push
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go run ./cmd/synctickers --check
